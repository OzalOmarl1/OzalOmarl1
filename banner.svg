<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ozal Omarlı — Bilgisayarlı Görü, Derin Öğrenme ve Siber Güvenlik">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1f38"/>
      <stop offset="1" stop-color="#12304f"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#5aa9ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <clipPath id="boxclip"><rect x="806" y="92" width="268" height="112"/></clipPath>
    <style>
      .name { font: 700 54px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; letter-spacing: 0.5px; }
      .sub  { font: 500 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9fc4ea; }
      .org  { font: 400 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #7d8fa6; }
      .mono { font: 500 15px Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace; fill: #7ee787; }
      .tag  { font: 700 13px Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace; fill: #0b1220; }
      .plate{ font: 700 25px Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace; fill: #0b1d3a; letter-spacing: 2px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .sweep  { animation: sweep 2.8s ease-in-out infinite alternate; }
      .pulse  { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(150px); } }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)" opacity="0.85"/>

  <!-- left: identity -->
  <text x="70" y="118" class="name">Ozal Omarlı</text>
  <rect x="72" y="136" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="178" class="sub">Bilgisayarlı Görü · Derin Öğrenme · Siber Güvenlik</text>
  <text x="70" y="208" class="org">OSTİM Teknik Üniversitesi · Mühendislik Fakültesi</text>
  <text x="70" y="250" class="mono">$ tespit --model yolov8 --protokol ön-kayıtlı --güvenlik etik<tspan class="cursor"> ▌</tspan></text>

  <!-- right: detection motif (licence plate inside a detection box) -->
  <g transform="translate(0,0)">
    <rect x="830" y="116" width="220" height="64" rx="8" fill="#e8eef7" stroke="#9fb3c8" stroke-width="2"/>
    <rect x="838" y="124" width="22" height="48" rx="3" fill="#1d4ed8"/>
    <text x="849" y="153" text-anchor="middle" style="font:700 11px Arial, sans-serif; fill:#fff">TR</text>
    <text x="957" y="157" text-anchor="middle" class="plate">06 YZ 2026</text>

    <g clip-path="url(#boxclip)">
      <rect class="sweep" x="806" y="92" width="268" height="36" fill="url(#scan)"/>
    </g>

    <!-- corner brackets -->
    <g fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round">
      <path d="M806 116 V92 H830"/>
      <path d="M1050 92 H1074 V116"/>
      <path d="M1074 180 V204 H1050"/>
      <path d="M830 204 H806 V180"/>
    </g>
    <rect x="806" y="92" width="268" height="112" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="6 6"/>

    <!-- label tag -->
    <rect x="806" y="64" width="134" height="24" rx="4" fill="#38bdf8"/>
    <text x="816" y="81" class="tag">plaka · 0.97</text>

    <!-- shield (security) -->
    <g transform="translate(1092,214)" class="pulse">
      <path d="M22 2 L40 9 V22 C40 34 32 42 22 46 C12 42 4 34 4 22 V9 Z" fill="none" stroke="#22c55e" stroke-width="3"/>
      <path d="M14 24 L20 30 L31 18" fill="none" stroke="#22c55e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="806" y="236" class="org" style="font-size:13px">YOLOv8 · OpenCV · PyTorch · Kali Linux</text>
  </g>
</svg>
